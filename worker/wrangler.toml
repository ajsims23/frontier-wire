# Frontier Wire API. Deployed by .github/workflows/worker.yml (the database id is filled in there).
name = "frontier-wire-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
SITE_URL = "https://ajsims23.github.io/frontier-wire/"
SENDER_NAME = "Frontier Wire"

[ai]
binding = "AI"   # Workers AI: illustrations for the daily recap (free daily allowance)

[[d1_databases]]
binding = "DB"
database_name = "frontier-wire"
database_id = "REPLACED_IN_CI"

[triggers]
crons = ["20 3 * * *", "35 3 * * *", "*/10 * * * *"]   # digests 08:50 IST; weekly feedback analysis 09:05 IST; finish sending an approved recap

[observability]
enabled = true   # Workers Logs (free): the worker's log lines, searchable in the Cloudflare dashboard
