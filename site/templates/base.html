<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:site_name" content="Frontier Wire">
<meta property="og:type" content="{{ og_type|default('website') }}">
<meta property="og:title" content="{{ og_title|default(title) }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title|default(title) }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ og_image }}">
<meta name="theme-color" content="#051416">
<link rel="alternate" type="application/rss+xml" title="Frontier Wire" href="{{ root }}data/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}style.css">
<script>{{ theme_boot|safe }}</script>
<link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
{% if jsonld %}<script type="application/ld+json">{{ jsonld|safe }}</script>{% endif %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include "_header.html" %}
<main id="main">
{% block main %}{% endblock %}
</main>
{% include "_newsletter.html" %}
{% include "_footer.html" %}
<script src="{{ root }}theme.js"></script>
<script src="{{ root }}cover.js"></script>
<script src="{{ root }}follow.js"></script>
<script src="{{ root }}player.js"></script>
{{ analytics|safe }}
</body>
</html>
