<div class="utility">
  <div class="shell u-row">
    <span class="u-date" id="u-date"></span>
    <span class="u-status"><span class="pulse" aria-hidden="true"></span><span id="updated">AI news, every story checked against its sources</span></span>
    <span class="u-links">{% if newsletter %}<a href="#nl-h">Newsletter</a>{% endif %}<a href="{{ root }}weekly/">Weekly deep dive</a><a href="{{ root }}data/feed.xml">RSS</a></span>
  </div>
</div>
<header class="top">
  <div class="shell top-row">
    <a class="mark" href="{{ root }}" aria-label="Frontier Wire home">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 26 26"><rect x="2" y="10" width="3.4" height="13" rx="1.7" fill="var(--models)"/><rect x="8.2" y="3" width="3.4" height="20" rx="1.7" fill="var(--research)"/><rect x="14.4" y="13" width="3.4" height="10" rx="1.7" fill="var(--policy)"/><rect x="20.6" y="7" width="3.4" height="16" rx="1.7" fill="var(--industry)"/></svg>
      <span class="mark-text"><span class="mark-name">Frontier Wire</span><span class="mark-tag">The AI newsroom</span></span>
    </a>
    <form class="search" role="search" action="{{ root }}" method="get">
      <label class="sr" for="q">Search stories</label>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" name="q" type="search" placeholder="Search stories, labs, models" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div class="actions">
      <a class="act act-ask" href="{{ root }}ask/"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Ask the Wire</span></a>
      <a class="act act-follow nav-follow" href="{{ root }}following/"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span>For you</span><span class="nf-n" hidden></span></a>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to light mode">
        <svg class="moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <nav class="secnav" aria-label="Sections">
    <div class="shell secnav-row">
      <a href="{{ root }}" data-nav="home">Top stories</a>
      <a href="{{ root }}#stories" data-topic="all">Latest</a>
      <a href="{{ root }}?topic=models#stories" data-topic="models">Models</a>
      <a href="{{ root }}?topic=research#stories" data-topic="research">Research</a>
      <a href="{{ root }}?topic=policy#stories" data-topic="policy">Policy &amp; safety</a>
      <a href="{{ root }}business/">Business</a>
      <a href="{{ root }}india/">India</a>
      <a href="{{ root }}sectors/">Sectors</a>
      <a href="{{ root }}builders/">Builders</a>
      <a href="{{ root }}voices/">Voices</a>
      <a href="{{ root }}models/">Model tracker</a>
      <a href="{{ root }}trackers/">Trackers</a>
      <a href="{{ root }}claims/">Claims</a>
      <a href="{{ root }}weekly/">Weekly</a>
    </div>
  </nav>
</header>
