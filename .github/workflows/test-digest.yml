# Sends every confirmed subscriber a preview of the daily digest, built from the latest stories.
# Run it from the Actions tab (Send test digest -> Run workflow). It doesn't change anyone's real digest.
name: Send test digest

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Send only to this email (leave empty to send to every confirmed subscriber)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          SECRET: ${{ secrets.ALERTS_DISPATCH_SECRET }}
          TO: ${{ inputs.to }}
        run: |
          url=$(cat config/api_url.txt)
          body=$(node -e 'process.stdout.write(JSON.stringify({to: process.env.TO || ""}))')
          curl -s -m 90 -X POST -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" -d "$body" "$url/api/test-digest" | tee result.txt
          grep -q '"sent":[1-9]' result.txt
