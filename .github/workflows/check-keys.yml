# Checks that each AI provider key is present and accepted, without printing the keys.
name: Check AI keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Groq key
        env:
          KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "GROQ_API_KEY is not set"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $KEY" https://api.groq.com/openai/v1/models)
          echo "Groq answered HTTP $code"; [ "$code" = "200" ]
      - name: Groq answers a question
        if: success()
        env:
          KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Reply with the word ok."}],"max_tokens":200}' \
            https://api.groq.com/openai/v1/chat/completions)
          echo "Groq chat HTTP $code"; [ "$code" = "200" ]
      - name: Cerebras key
        if: always()
        env:
          KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $KEY" https://api.cerebras.ai/v1/models)
          echo "Cerebras answered HTTP $code"; [ "$code" = "200" ]
      - name: Cerebras answers a question (catches quota / billing problems)
        if: always()
        env:
          KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"gpt-oss-120b","messages":[{"role":"user","content":"Reply with the word ok."}],"max_tokens":200}' \
            https://api.cerebras.ai/v1/chat/completions)
          echo "Cerebras chat HTTP $code"; [ "$code" = "402" ] && echo "402 = free quota used up or billing needed (cloud.cerebras.ai → Billing)"; [ "$code" = "200" ]
      - name: Gemini key (optional)
        if: always()
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "GEMINI_API_KEY not set (optional fallback)"; exit 0; }
          code=$(curl -s -o out.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"gemini-flash-lite-latest","messages":[{"role":"user","content":"Reply with the word ok."}],"max_tokens":50}' \
            https://generativelanguage.googleapis.com/v1beta/openai/chat/completions)
          echo "Gemini chat HTTP $code"; [ "$code" = "200" ]
      - name: Gemini — which models work with tool calls (and how busy they are)
        if: always()
        timeout-minutes: 10
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          set +e   # report every model, even when one errors
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?pageSize=300&key=$KEY" \
            | jq -r '.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name | sub("^models/";"")' \
            | grep -iE "flash|gemma" | grep -viE "tts|image|audio|live|embed|robotics|computer|omni|preview" | sort | tee models.txt
          tool='{"type":"function","function":{"name":"answer","description":"Give the answer","parameters":{"type":"object","properties":{"word":{"type":"string"}},"required":["word"]}}}'
          while read -r m; do
            for try in 1 2; do
              res=$(curl -s -o out.json -w "%{http_code} %{time_total}" -m 60 -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Call answer with the word ok.\"}],\"tools\":[$tool],\"tool_choice\":{\"type\":\"function\",\"function\":{\"name\":\"answer\"}},\"max_tokens\":300}" \
                https://generativelanguage.googleapis.com/v1beta/openai/chat/completions)
              called=$(jq -r '.choices[0].message.tool_calls[0].function.name // "-"' out.json 2>/dev/null)
              echo "$m try$try: HTTP $res tool=$called $(jq -rc '.error.message // empty' out.json 2>/dev/null | cut -c1-120)"
              sleep 4
            done
          done < models.txt

      - name: NVIDIA key (optional) — which models work with tool calls
        if: always()
        timeout-minutes: 12
        env:
          KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "NVIDIA_API_KEY not set (optional fallback)"; exit 0; }
          models=$(curl -s -m 30 -H "Authorization: Bearer $KEY" https://integrate.api.nvidia.com/v1/models \
            | grep -oE '"id": ?"[^"]*"' | sed -E 's/"id": ?"//; s/"$//' \
            | grep -iE 'gpt-oss|nemotron|kimi|deepseek|glm|qwen|llama-3|mistral|gemma' \
            | grep -viE 'embed|guard|safety|reward|parse|vl-|omni|coder|vision|bolt|nano|mini|1b|3b|8b' | sort -u | head -20) || true
          ok=0
          for m in $models; do
            : > out.json
            code=$(curl -s -m 60 -o out.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Call submit with ok=true.\"}],\"max_tokens\":1500,\"tools\":[{\"type\":\"function\",\"function\":{\"name\":\"submit\",\"parameters\":{\"type\":\"object\",\"properties\":{\"ok\":{\"type\":\"boolean\"}},\"required\":[\"ok\"]}}}],\"tool_choice\":{\"type\":\"function\",\"function\":{\"name\":\"submit\"}}}" \
              https://integrate.api.nvidia.com/v1/chat/completions) || code="timeout"
            tool=$(grep -c '"tool_calls"' out.json 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$tool" != "0" ]; then echo "WORKS  $m"; ok=1
            else echo "no     $m  (HTTP $code: $(head -c 120 out.json 2>/dev/null | tr '\n' ' '))"; fi
          done
          [ "$ok" = "1" ]
      - name: Mistral key (optional)
        if: always()
        env:
          KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "MISTRAL_API_KEY not set (optional fallback)"; exit 0; }
          code=$(curl -s -o out.json -w "%{http_code}" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"mistral-small-latest","messages":[{"role":"user","content":"Reply with the word ok."}],"max_tokens":20}' \
            https://api.mistral.ai/v1/chat/completions)
          echo "Mistral chat HTTP $code"; [ "$code" = "200" ] || head -c 300 out.json
          [ "$code" = "200" ]
      - name: OpenRouter key (optional)
        if: always()
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "OPENROUTER_API_KEY not set (optional fallback)"; exit 0; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $KEY" https://openrouter.ai/api/v1/key)
          echo "OpenRouter answered HTTP $code"; [ "$code" = "200" ]
