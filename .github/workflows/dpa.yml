name: DPA lens

# Frontier Wire's intelligence agent for DPA: assesses new stories for DPA, keeps the DPA AI Radar current,
# writes "what this means for DPA" and the weekly calls, and fact-checks a sample of published stories (see agent/dpa.py).
# Runs between newsroom runs, with its own request caps, and writes only data/dpa/.
on:
  schedule:
    - cron: "47 1,4,7,10,13,16,19,22 * * *"   # every 3 hours, 90 minutes after each newsroom run
  push:
    branches: [main]
    paths: ["config/dpa.yaml", "agent/dpa.py", "agent/factcheck.py", ".github/workflows/dpa.yml"]
  workflow_dispatch:

permissions:
  actions: read   # the gate job checks whether this slot already ran
  contents: write

concurrency:
  group: dpa
  cancel-in-progress: false

jobs:
  gate:
    # GitHub's cron fires late or not at all, so the Cloudflare worker also starts this workflow when a slot is
    # missed (worker/src/scheduler.js). If a run already happened in this slot, a late cron run would only repeat it.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            now=$(date -u +%s); slot=$(( now - (now - 6420) % 10800 ))
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/dpa.yml/runs?per_page=10" \
              --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion != \"cancelled\" and (.created_at | fromdate) >= $slot)] | length" || echo 0)
            if [ "$n" -gt 0 ]; then go=false; echo "Already ran in this slot; skipping." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests/test_dpa.py
      - name: Run the DPA lens
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m agent dpa
      - name: Commit
        run: |
          git config user.name  "frontier-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dpa/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "DPA lens: assessments, radar, calls, audit"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.event.repository.default_branch }} && exit 0
            git pull --rebase -X theirs origin ${{ github.event.repository.default_branch }} || { git rebase --abort; sleep 5; }
          done
          exit 1
