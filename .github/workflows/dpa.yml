name: DPA lens

# Frontier Wire's intelligence agent for DPA: assesses new stories for DPA, keeps the DPA AI Radar current,
# writes the weekly calls and POC cards, and fact-checks a sample of published stories (see agent/dpa.py).
# Runs between newsroom runs, with its own request caps, and writes only data/dpa/.
on:
  schedule:
    - cron: "47 1,4,7,10,13,16,19,22 * * *"   # every 3 hours, 90 minutes after each newsroom run
  push:
    branches: [main]
    paths: ["config/dpa.yaml", "agent/dpa.py", "agent/factcheck.py", ".github/workflows/dpa.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpa
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests/test_dpa.py
      - name: Run the DPA lens
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m agent dpa
      - name: Commit
        run: |
          git config user.name  "frontier-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dpa/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "DPA lens: assessments, radar, calls, audit"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.event.repository.default_branch }} && exit 0
            git pull --rebase -X theirs origin ${{ github.event.repository.default_branch }} || { git rebase --abort; sleep 5; }
          done
          exit 1
