# Breaking news: every 15 minutes, check the labs' own announcement channels. If there's something new,
# run a quick breaking-news edition (judge, verify, write, tag, photo, alerts) and publish it.
# Most checks find nothing and finish in under a minute without using any AI.
name: Breaking news watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the website deploy after publishing breaking news

concurrency:
  group: newsroom          # shared with the full newsroom run, so they never write at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the labs
        id: watch
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ vars.API_URL }}
          ALERTS_DISPATCH_SECRET: ${{ secrets.ALERTS_DISPATCH_SECRET }}
        run: python -m agent watch
      - name: Commit and publish
        if: steps.watch.outputs.new_items != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "frontier-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Breaking: lab announcement check"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.event.repository.default_branch }} && { gh workflow run deploy.yml; exit 0; }
            git pull --rebase -X theirs origin ${{ github.event.repository.default_branch }} || { git rebase --abort; sleep 5; }
          done
          exit 1
