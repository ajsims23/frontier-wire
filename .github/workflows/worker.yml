# Deploys the Frontier Wire API (Ask the Wire + email alerts) to Cloudflare Workers, free tier.
# Needs these repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BREVO_API_KEY,
# ALERTS_DISPATCH_SECRET, CEREBRAS_API_KEY (optional GROQ_API_KEY), and the variable SENDER_EMAIL
# (an address you verified in Brevo). Skips quietly until the Cloudflare secrets exist.
name: Deploy API

on:
  push:
    branches: [main]
    paths: ["worker/**", "site/search.js", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: write   # records the API address in config/api_url.txt so the site can use it

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test worker/test/search.test.mjs worker/test/worker.test.mjs
      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet; skipping deploy."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install wrangler
        if: steps.setup.outputs.ready == 'true'
        run: npm install -g wrangler@4
      - name: Database
        if: steps.setup.outputs.ready == 'true'
        working-directory: worker
        run: |
          id=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="frontier-wire");process.stdout.write(db?db.uuid:"")})')
          if [ -z "$id" ]; then
            wrangler d1 create frontier-wire
            id=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(d=>d.name==="frontier-wire").uuid)})')
          fi
          sed -i "s/REPLACED_IN_CI/$id/" wrangler.toml
          wrangler d1 execute frontier-wire --remote --file schema.sql --yes
      - name: workers.dev address
        if: steps.setup.outputs.ready == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          current=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write((JSON.parse(s).result||{}).subdomain||"")}catch(e){}})')
          if [ -z "$current" ]; then
            name="frontier-wire-${CLOUDFLARE_ACCOUNT_ID:0:6}"
            echo "Registering workers.dev subdomain $name"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$name\"}" "$api" | head -c 400; echo
          else
            echo "workers.dev subdomain: $current"
          fi
      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        working-directory: worker
        env:
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
        run: |
          wrangler deploy --var "SENDER_EMAIL:${SENDER_EMAIL}" | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)
          echo "API address: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$url" ]; then echo "$url" > ../config/api_url.txt; else echo "No workers.dev address in the deploy output (is a workers.dev subdomain set up?)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Secrets
        if: steps.setup.outputs.ready == 'true'
        working-directory: worker
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DISPATCH_SECRET: ${{ secrets.ALERTS_DISPATCH_SECRET }}
        run: |
          for name in CEREBRAS_API_KEY GROQ_API_KEY BREVO_API_KEY DISPATCH_SECRET; do
            val="${!name}"
            if [ -n "$val" ]; then printf '%s' "$val" | wrangler secret put "$name" >/dev/null && echo "set $name"; fi
          done
      - name: Record the API address
        if: steps.setup.outputs.ready == 'true'
        run: |
          git checkout -- worker/wrangler.toml   # undo the database id filled in for this deploy
          git config user.name "frontier-wire-bot"
          git config user.email "frontier-wire-bot@users.noreply.github.com"
          tail -n 25 worker/deploy.log | sed 's/[A-Za-z0-9_-]\{40,\}/[hidden]/g' > worker/last-deploy.txt   # for troubleshooting
          git add worker/last-deploy.txt
          [ -f config/api_url.txt ] && git add config/api_url.txt
          if ! git diff --cached --quiet; then
            git commit -m "API address updated"
            git pull --rebase origin main && git push
          fi
