name: DPA task bench

# Tests every free model the newsroom can reach on DPA-style document work (synthetic documents only),
# scored automatically against known answers. Results: data/bench/results.json and the site's /bench/ page.
on:
  schedule:
    - cron: "41 6 * * 0"   # Sundays, 12:11 IST
  push:
    branches: [main]
    paths: ["data/bench/tasks.json", "agent/bench.py", ".github/workflows/bench.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests/test_dpa.py
      - name: Give other runs the free tier first
        if: github.event_name == 'push'
        run: sleep 240
      - name: Run the bench
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m agent bench
      - name: Commit
        run: |
          git config user.name  "frontier-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bench/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "DPA task bench: weekly results"
          for i in 1 2 3; do
            git push origin HEAD:${{ github.event.repository.default_branch }} && exit 0
            git pull --rebase -X theirs origin ${{ github.event.repository.default_branch }} || { git rebase --abort; sleep 5; }
          done
          exit 1
