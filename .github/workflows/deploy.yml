name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "agent/build.py", "agent/cards.py", "config/settings.yaml"]
  workflow_run:                 # after each newsroom run (auto mode publishes straight to main)
    workflows: ["Newsroom agent"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site (home, story pages, lab pages, previews, sitemap)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          NEWSLETTER_USERNAME: ${{ vars.NEWSLETTER_USERNAME }}
          API_URL: ${{ vars.API_URL }}
        run: python -m agent.build --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
