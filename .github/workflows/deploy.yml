name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "agent/**", "config/**"]
  workflow_run:                 # after each newsroom run (auto mode publishes straight to main)
    workflows: ["Newsroom agent", "Recap release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site (home, story pages, lab pages, previews, sitemap)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          NEWSLETTER_USERNAME: ${{ vars.NEWSLETTER_USERNAME }}
          API_URL: ${{ vars.API_URL }}
        run: python -m agent.build --out _site

      - name: Add the daily recap videos (stored as GitHub Releases, listed by the build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s _site/videos/assets.txt ] || exit 0
          while read -r tag date file; do
            mkdir -p "_site/videos/$date"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "_site/videos/$date" --clobber \
              || echo "::warning::could not download $file from $tag"
          done < _site/videos/assets.txt
          rm _site/videos/assets.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # Today's recap: once the site serves it, email the editor a preview with an "Approve and send" button.
      # The worker sends one preview per day, however many times this runs. Needs the RECAP_REVIEWER_EMAIL secret.
      - name: Email the recap preview
        if: hashFiles('_site/videos/latest.json') != ''
        env:
          SECRET: ${{ secrets.ALERTS_DISPATCH_SECRET }}
          TO: ${{ secrets.RECAP_REVIEWER_EMAIL }}
          PAGE: ${{ steps.deployment.outputs.page_url }}
        run: |
          date=$(jq -r .date _site/videos/latest.json)
          [ "$date" = "$(TZ=Asia/Kolkata date +%F)" ] || { echo "Latest recap is $date, not today; nothing to preview."; exit 0; }
          if [ -z "$TO" ] || [ -z "$SECRET" ]; then echo "::notice::Add the RECAP_REVIEWER_EMAIL secret to get recap previews by email."; exit 0; fi
          for i in $(seq 1 20); do   # wait until the live site serves today's recap
            live=$(curl -s -m 20 "${PAGE}videos/latest.json?t=$(date +%s)" | jq -r .date 2>/dev/null || true)
            [ "$live" = "$date" ] && break; sleep 15
          done
          [ "$live" = "$date" ] || { echo "::warning::the site isn't serving the $date recap yet; the next deploy will retry"; exit 0; }
          api=$(cat config/api_url.txt)
          body=$(jq -nc --arg d "$date" --arg to "$TO" '{date: $d, to: $to}')
          res=$(curl -s -m 60 -X POST -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" -d "$body" "$api/api/recap/preview")
          echo "$res" | sed 's/"to":"[^"]*"/"to":"[hidden]"/'
          echo "$res" | jq -e '.sent == 1 or .skipped' >/dev/null || echo "::warning::recap preview not sent: $res"
