name: Recap release

# The daily recap session pushes the rendered files to recap-upload/<date> (main plus one commit).
# This checks them, stores them as the GitHub Release recap-<date>, marks the recap published on main
# (which redeploys the site) and deletes the upload branch, so video files never land on main.
on:
  push:
    branches: ["recap-upload/**"]

permissions:
  contents: write

concurrency:
  group: recap-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Take the uploaded files
        run: |
          DATE="${GITHUB_REF_NAME#recap-upload/}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::branch must be recap-upload/YYYY-MM-DD"; exit 1; }
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          mkdir -p "_recap/$DATE"
          cp recap-upload/recap.mp4 recap-upload/poster.jpg recap-upload/teaser.gif recap-upload/script.json "_recap/$DATE/"
          git checkout -q -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg (to check the video)
        run: command -v ffprobe || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }

      - name: Check the video and script
        run: python -m agent recap stamp --date "$DATE" --out "_recap/$DATE"

      - name: Store the files as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="recap-$DATE"
          FILES="_recap/$DATE/recap.mp4 _recap/$DATE/poster.jpg _recap/$DATE/teaser.gif"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target main --title "Frontier Wire recap, $DATE" \
              --notes "$(jq -r .hook "_recap/$DATE/script.json")" --latest=false
          fi
          n=$(gh release view "$TAG" --json assets --jq '.assets | length')
          [ "$n" -ge 3 ] || { echo "::error::release $TAG has $n files, expected 3"; exit 1; }

      - name: Put the recap on the site
        run: |
          git config user.name  "frontier-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/recaps/$DATE.json"
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Recap: $DATE"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; sleep 5; }
          done
          exit 1

      - name: Delete the upload branch
        run: git push origin --delete "$GITHUB_REF_NAME"
