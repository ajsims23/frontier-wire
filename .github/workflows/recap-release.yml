name: Recap release

# The daily recap session pushes the day's script to recap-upload/<date> (main plus one commit).
# This fetches a stock clip per story (Pexels), an AI illustration as the fallback and the AI narration (both
# Workers AI via our API worker), renders and checks the video,
# stores the files as the GitHub Release recap-<date>, marks the recap published on main (which redeploys
# the site) and deletes the upload branch, so video files never land on main.
on:
  push:
    branches: ["recap-upload/**"]

permissions:
  contents: write

concurrency:
  group: recap-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Take the uploaded script
        run: |
          DATE="${GITHUB_REF_NAME#recap-upload/}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::branch must be recap-upload/YYYY-MM-DD"; exit 1; }
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          mkdir -p "_recap/$DATE"
          cp recap-upload/script.json "_recap/$DATE/"
          # a re-publish of a video that was already rendered (e.g. when Workers AI is out of quota for the day)
          if [ -f recap-upload/prebuilt/recap.mp4 ]; then cp recap-upload/prebuilt/* "_recap/$DATE/"; echo "PREBUILT=1" >> "$GITHUB_ENV"; fi
          git checkout -q -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install ffmpeg (static build from GitHub; apt as the fallback)
        timeout-minutes: 6
        run: |
          command -v ffprobe && exit 0
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/ff.tar.xz && tar -xJf /tmp/ff.tar.xz -C /tmp; then
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            sudo timeout 240 apt-get update -qq && sudo timeout 240 apt-get install -y -qq ffmpeg >/dev/null
          fi
          ffmpeg -version | head -1

      - name: AI illustrations (Workers AI; a story without one gets the drawn illustration)
        if: env.PREBUILT != '1'
        env:
          RECAP_SECRET: ${{ secrets.ALERTS_DISPATCH_SECRET }}
        run: RECAP_API="$(cat config/api_url.txt)" python -m agent recap images --date "$DATE" --out "_recap/$DATE"

      - name: Stock footage (Pixabay / Pexels when their keys exist, else free-licence Wikimedia Commons clips)
        if: env.PREBUILT != '1'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m agent recap footage --date "$DATE" --out "_recap/$DATE"

      - name: AI narration (Workers AI via our API worker; without it the video renders silent)
        if: env.PREBUILT != '1'
        env:
          RECAP_SECRET: ${{ secrets.ALERTS_DISPATCH_SECRET }}
        run: RECAP_API="$(cat config/api_url.txt)" python -m agent recap voice --date "$DATE" --out "_recap/$DATE"

      - name: Cache the backup voice model
        if: env.PREBUILT != '1'
        uses: actions/cache@v4
        with:
          path: ~/.kokoro
          key: kokoro-onnx-v1.0

      - name: Backup voice (open-source Kokoro) if the Workers AI voice failed
        if: env.PREBUILT != '1'
        run: |
          if ls "_recap/$DATE/voice/"*.mp3 >/dev/null 2>&1; then echo "Workers AI narration is in place"; exit 0; fi
          echo "::warning::Workers AI narration missing; using the Kokoro backup voice"
          pip install -q kokoro-onnx soundfile
          mkdir -p ~/.kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s ~/.kokoro/$f ] || curl -fsSL --retry 3 --max-time 600 "$base/$f" -o ~/.kokoro/$f
          done
          python -m agent recap voice-backup --date "$DATE" --out "_recap/$DATE"

      - name: Render the video
        if: env.PREBUILT != '1'
        run: python -m agent recap render --date "$DATE" --out "_recap/$DATE"

      - name: Check the video and script
        run: python -m agent recap stamp --date "$DATE" --out "_recap/$DATE"

      - name: Store the files as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="recap-$DATE"
          FILES="_recap/$DATE/recap.mp4 _recap/$DATE/poster.jpg _recap/$DATE/teaser.gif"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target main --title "Frontier Wire recap, $DATE" \
              --notes "$(jq -r .hook "_recap/$DATE/script.json")" --latest=false
          fi
          n=$(gh release view "$TAG" --json assets --jq '.assets | length')
          [ "$n" -ge 3 ] || { echo "::error::release $TAG has $n files, expected 3"; exit 1; }

      - name: Put the recap on the site
        run: |
          git config user.name  "frontier-wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/recaps/$DATE.json"
          git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "Recap: $DATE"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; sleep 5; }
          done
          exit 1

      - name: Delete the upload branch
        run: git push origin --delete "$GITHUB_REF_NAME"
