# Temporary: previews the editor-in-chief, Builders desk and Top Voices with real sources before merging.
# Runs only on the feature branch, commits nothing, sends no emails or alerts. Delete before merging.
name: Preview new desks

on:
  push:
    branches: [feature/chief-builders-voices]

permissions:
  contents: read

concurrency:
  group: preview-desks
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Plan and write the desks (into a throwaway copy of data/)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DATA_DIR: /tmp/preview-data
        run: |
          cp -r data /tmp/preview-data
          python -m agent preview-desks
      - name: Build the site from the preview data
        env:
          DATA_DIR: /tmp/preview-data
          SITE_URL: https://ajsims23.github.io/frontier-wire/
        run: |
          python -m agent.build --out _site
          mkdir -p preview/data
          cp -r _site/index.html _site/builders _site/voices _site/*.js _site/*.css _site/favicon.svg preview/
          cp _site/data/site.json _site/data/desks.json preview/data/
          cp /tmp/preview-data/plan.json /tmp/preview-data/builders.json /tmp/preview-data/top_voices.json /tmp/preview-data/last_run.json preview/data/
      - uses: actions/upload-artifact@v4
        with:
          name: desk-preview
          path: preview/
          retention-days: 3
