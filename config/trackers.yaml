# Living trackers: storylines the newsroom agent keeps current ("where things stand").
# Each run the agent files new stories under these, then rewrites the status, timeline and what's next.
# Add or edit freely; `scope` tells the agent what belongs.
trackers:
  - id: us-china
    title: US–China AI restrictions
    scope: US export controls on AI chips, bans or restrictions on Chinese AI models and companies (e.g. DeepSeek), China's responses and workarounds.
  - id: frontier-race
    title: The frontier model race
    scope: Major new models and capability leaps from the leading labs (OpenAI, Anthropic, Google DeepMind, Meta, xAI, Mistral, DeepSeek and others). Not minor updates.
  - id: ai-regulation
    title: AI regulation around the world
    scope: The EU AI Act and its enforcement, US federal and state AI rules, UK and other governments' AI laws, standards and executive actions.
  - id: india-ai
    title: India's AI push
    scope: IndiaAI Mission, Indian government AI policy, compute and data-centre build-out in India, major Indian AI startups, funding and adoption.
  - id: copyright
    title: AI and copyright
    scope: Lawsuits over AI training data and outputs, court rulings, licensing deals between AI labs and publishers, artists or music companies.
  - id: agent-safety
    title: AI agents and safety incidents
    scope: AI agents misbehaving or causing incidents, safety evaluations, safeguards and monitoring, security vulnerabilities found by or in AI systems.
  - id: ai-infrastructure
    title: The AI infrastructure build-out
    scope: Data centres, AI chips and supercomputers, power and water for AI, cloud capacity deals and capital spending on AI infrastructure.
  - id: ai-money
    title: AI funding and valuations
    scope: Large AI funding rounds, valuations, IPO plans, acquisitions and signs of a bubble or slowdown in AI investment.
