# ---- Builders desk: what people are making with AI (all free, no keys) ----------------------------
# Checked once a day; the agent picks the 5–8 most interesting builds. Failures show in the run report.
#   show_hn   – Show HN posts matching the queries, above a points threshold
#   github    – new repositories on these topics, by stars (uses the workflow's built-in token)
#   hf_spaces – trending Hugging Face Spaces (demos and apps)
#   feed      – any RSS/Atom feed of launches; ai_only keeps only AI-related entries
builders:
  - {id: show-hn, kind: show_hn, queries: ["AI", "LLM", "agent", "Claude", "GPT", "MCP"], min_points: 15, hours: 48}
  - {id: github-new, kind: github, topics: [llm, ai-agents, mcp, generative-ai, rag], min_stars: 50, days: 10}
  - {id: hf-spaces, kind: hf_spaces, limit: 25, details: 10}
  - {id: product-hunt, kind: feed, name: Product Hunt, url: "https://www.producthunt.com/feed?category=artificial-intelligence", signal: "launched on Product Hunt", hours: 48}
  - {id: r-localllama, kind: feed, name: "r/LocalLLaMA", url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day", signal: "top post today on r/LocalLLaMA", hours: 48}
  - {id: r-sideproject, kind: feed, name: "r/SideProject", url: "https://www.reddit.com/r/SideProject/top/.rss?t=day", signal: "top post today on r/SideProject", hours: 48, ai_only: true}

# ---- Top Voices: what AI's leading people are arguing about -----------------------------------------
# Free only. First-hand: the Bluesky accounts and voice blogs above, plus these feeds. Second-hand X coverage:
# news articles that report what these people posted on X (we never read X itself). Hacker News: the week's
