  - {company: Google DeepMind, platform: greenhouse, token: deepmind, lab: Google DeepMind, careers: "https://deepmind.google/about/careers/"}
  - {company: xAI, platform: greenhouse, token: xai, lab: xAI, careers: "https://x.ai/careers"}
  - {company: OpenAI, platform: ashby, token: openai, lab: OpenAI, careers: "https://openai.com/careers"}
  - {company: Cohere, platform: ashby, token: cohere, lab: Cohere, careers: "https://cohere.com/careers"}
  - {company: Perplexity, platform: ashby, token: perplexity, lab: Perplexity, careers: "https://www.perplexity.ai/hub/careers"}
  - {company: ElevenLabs, platform: ashby, token: elevenlabs, lab: ElevenLabs, careers: "https://elevenlabs.io/careers"}
  - {company: Mistral AI, platform: lever, token: mistral, lab: Mistral AI, careers: "https://mistral.ai/careers"}
  - {company: Scale AI, platform: greenhouse, token: scaleai, lab: Scale AI, careers: "https://scale.com/careers"}
  - {company: Databricks, platform: greenhouse, token: databricks, lab: Databricks, careers: "https://www.databricks.com/company/careers"}

