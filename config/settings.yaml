# Newsroom agent settings.

# AI providers, tried in order. Every one uses the standard chat-completions API.
# A provider is used only when its key is set (GitHub → Settings → Secrets → Actions).
# If a provider is rate-limited or down, the agent moves to the next; if a model
# name has been retired, it tries the next model in the list.
# Free-tier limits change; run `python -m agent check-models` to see what works.
providers:
  - name: cerebras            # free: ~1M tokens/day, 30 requests/min
    base_url: https://api.cerebras.ai/v1
    key_env: CEREBRAS_API_KEY
    models: [gpt-oss-120b]   # if this is retired, the agent asks Cerebras for its current models

  - name: groq                # free: ~1,000 requests/day on 70B models
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    models: [openai/gpt-oss-120b, llama-3.3-70b-versatile]

  - name: openrouter          # free models: ~50 requests/day without credit
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    models: ["meta-llama/llama-3.3-70b-instruct:free"]

  - name: gemini              # free tier: low daily limits; Google may use prompts to improve its products
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
    models: [gemini-flash-lite-latest, gemini-flash-latest]

  # Optional paid fallback — uncomment to use Claude (needs ANTHROPIC_API_KEY).
  # - name: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   key_env: ANTHROPIC_API_KEY
  #   models: [claude-sonnet-5-5]

run:
  lookback_hours: 36          # ignore items older than this
  max_story_age_hours: 72     # never write up an article older than this, whatever path it came in by
  max_candidates_to_judge: 80 # items sent to the editor per run (in batches)
  judge_batch: 45            # items per editor request
  desk_judge_quota: 25       # editor slots reserved for desk sources (e.g. India)
  desk_write_slots: 3        # writing slots reserved for desk stories
  write_time_budget_min: 14  # stop starting new stories after this; the rest carry over
  min_score: 6                # 1–10; below this an item is dropped
  max_stories_per_run: 10     # stories written per run
  max_per_lab_per_run: 2      # variety: at most this many stories from one lab/publisher per run
  max_adjacent_per_run: 1     # loosely-AI stories (AI is a side angle) written per run, only after core AI news
  adjacent_max_score: 6       # loosely-AI stories never score above this, so they never lead the page
  aggregator_domains: [techmeme.com, news.ycombinator.com, msn.com]  # count against the outlet behind the link, not the aggregator
  front_page_days: 14         # stories older than this leave the front page (kept in archive)
  source_text_chars: 3000     # how much of each source page the writer reads

guardrails:
  # A story needs either an official primary source (the lab's own post / the paper /
  # the person's own post) or this many independent domains confirming it.
  min_independent_sources: 2
  # Quotes are only published if found word-for-word in a fetched source.
  require_verbatim_quotes: true

# Review mode: when true, new stories arrive as a pull request you merge to publish.
# Off by default: stories publish automatically (the repository variable REVIEW_MODE overrides this).
review_mode: false

# Research agent: investigates stories with tools (search news, read pages) before they're written.
research:
  enabled: true
  max_steps: 4            # tool steps per story
  max_stories: 5          # stories investigated per run (keeps runs short)
  enrich_top: 1           # also dig into this many top stories per run that are already confirmed
  enrich_min_score: 8
  page_chars: 2500        # how much of each page the agent reads

limits:
  # Keeps the agent well inside free tiers. A run stops calling AI once a cap is hit;
  # anything not yet judged is picked up next run.
  max_requests_per_run: 70
  max_requests_per_day: 450
  max_tokens_per_day: 900000

# Free, no-key data APIs
gdelt:
  query: '("artificial intelligence" OR OpenAI OR Anthropic OR DeepMind OR "large language model" OR "AI model") sourcelang:english'
  max_records: 60

# Daily email of the briefing (needs the BUTTONDOWN_API_KEY secret).
newsletter:
  enabled: true
  send_after_utc_hour: 2    # first run after 02:00 UTC (the ~8:45 am IST run) sends it, once a day

# The website. Fill these in as you set things up; empty values are simply skipped.
site:
  base_url: https://ajsims23.github.io/frontier-wire/   # where the site lives (used in links and previews)
  custom_domain: ""      # e.g. frontierwire.ai, once you own a domain
  goatcounter: "frontierwire"        # your GoatCounter code, e.g. frontierwire  -> visitor stats
  newsletter: ""         # your Buttondown username                 -> daily email signup
